<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레시피 복구</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #eeeae4;
    color: #1a1a18;
  }
  main {
    width: min(520px, calc(100vw - 32px));
    background: #fff;
    border: 1px solid rgba(0,0,0,.12);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 18px 50px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 10px; font-size: 22px; }
  p { margin: 0; color: #666; line-height: 1.6; }
  .status { margin-top: 18px; font-weight: 700; color: #111; }
</style>
</head>
<body>
<main>
  <h1>레시피 복구 중</h1>
  <p>현재 Chrome 프로필의 저장소에 레시피 데이터를 복구하고 있습니다.</p>
  <div class="status" id="status">잠시만 기다려주세요...</div>
</main>
<script>
(async function restoreRecipes() {
  const status = document.getElementById("status");
  try {
    const response = await fetch("./recipesss-localstorage-recovered.json?ts=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("복구 파일을 불러오지 못했습니다.");
    const recovered = await response.json();
    const data = recovered.data || {};
    Object.entries(data).forEach(([key, value]) => localStorage.setItem(key, value));

    const recipe = JSON.parse(localStorage.getItem("recipe_cost_utf8_v1") || "{}");
    const count = Array.isArray(recipe.products) ? recipe.products.length : 0;
    status.textContent = `복구 완료: 제품 ${count}개`;
    setTimeout(() => {
      location.href = "./index.html?restored=" + Date.now();
    }, 900);
  } catch (error) {
    status.textContent = "복구 실패: " + error.message;
  }
})();
</script>
</body>
</html>
